services:
  - type: web
    name: glowbi
    runtime: python
    buildCommand: pip install -r requirements.render.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: openai/gpt-oss-120b
      - key: OPENAI_FALLBACK_MODEL
        value: openai/gpt-oss-20b
      - key: VISION_MODEL
        value: qwen/qwen3.8-27b
      - key: TTS_ENGINE
        value: browser
      - key: AUTO_FEED
        value: "false"
      - key: USE_EMBEDDINGS
        value: "false"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
